<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who Goes First?</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            color: #ffffff;
        }
        .container {
            text-align: center;
            background: #2a2a2a;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 80%;
            max-width: 400px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #aaaaaa;
        }
        .result-box {
            font-size: 36px;
            font-weight: bold;
            height: 60px;
            line-height: 60px;
            margin-top: 20px;
            color: #00ff88;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>First Player Is...</h1>
        <div class="result-box" id="display">...</div>
    </div>

    <script>
        // EDIT THESE NAMES FOR YOUR PLAYERS
        const players = ["Player A", "Player B", "Player C", "Player D", "Player E"];
        
        const display = document.getElementById('display');

        function pickPlayer() {
            let counter = 0;
            const totalShuffles = 12;
            
            // Rapid shuffling loop animation
            const interval = setInterval(() => {
                const randomVisual = players[Math.floor(Math.random() * players.length)];
                display.innerText = randomVisual;
                display.style.color = "#ffbb00"; // Rolling color
                counter++;
                
                if (counter > totalShuffles) {
                    clearInterval(interval);
                    
                    // Final winner generation
                    const winner = players[Math.floor(Math.random() * players.length)];
                    display.innerText = winner;
                    display.style.color = "#00ff88"; // Winner highlight color
                }
            }, 100);
        }

        // Run instantly when the webpage finishes loading from the NFC scan
        window.addEventListener('DOMContentLoaded', () => {
            pickPlayer();
        });
    </script>

</body>
</html>
